
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Soul Sacrifice Card Game</title>
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>

<div id="title-screen" class="screen active">
  <h1>Soul Sacrifice</h1>
  <p>ブラウザで遊べるカードゲーム</p>
  <button id="btn-start">AI対戦</button>
  <button id="btn-start-saved" class="secondary">保存したデッキで対戦</button>
  <button id="btn-pvp" class="secondary">対人戦（オンライン）</button>
  <button id="btn-glossary-title" class="secondary">能力一覧</button>
</div>

<div id="pvp-screen" class="screen">
  <h2>対人戦</h2>
  <p class="hint">相手と同じコードをおたがいに入力して「接続」を押してください。ふたりが同じコードを入力すると自動でマッチングされます。</p>
  <input id="pvp-code-input" type="text" inputmode="latin" maxlength="20" placeholder="例: ABC123" autocomplete="off" autocapitalize="characters">
  <div class="controls two">
    <button id="btn-pvp-connect">接続</button>
    <button id="btn-pvp-back" class="secondary">タイトルへ戻る</button>
  </div>
  <p id="pvp-status" class="hint"></p>
</div>

<div id="deckbuilder-screen" class="screen">
  <h2>デッキ編成</h2>
  <p class="hint">カードの枚数を選んでください（<span id="deck-total">0</span> / <span id="deck-min">10</span>枚以上、最大<span id="deck-max">27</span>枚）</p>
  <p id="deck-pvp-status" class="hint"></p>
  <div id="deck-list" class="deck-list"></div>
  <div class="controls">
    <button id="btn-deck-reset" class="secondary">おまかせ編成</button>
    <button id="btn-deck-save" class="secondary">デッキを保存</button>
    <button id="btn-deck-confirm">この編成でスタート</button>
  </div>
</div>

<div id="game-screen" class="screen">
  <div id="enemy-field-count" class="field-count">場 0 / 4</div>
      <div id="enemy-lanes" class="lanes-wrap"></div>

  <div class="turnbar">
    <span id="turn-label">ターン 1</span>
    <span id="active-label" class="active-label">あなたの番</span>
    <span id="phase-label">ドロー</span>
    <button id="btn-glossary" class="mini">能力</button>
  </div>

  <div id="player-field-count" class="field-count">場 0 / 4</div>
      <div id="player-lanes" class="lanes-wrap"></div>

  <div class="status enemy">
    <span class="status-owner">相手</span>
    <span>HP <b id="enemy-hp">20</b></span>
    <span>魂 <b id="enemy-soul">0</b></span>
    <span>山札 <b id="enemy-deck">0</b></span>
  </div>

  <div class="status player">
    <span class="status-owner">自分</span>
    <span>HP <b id="player-hp">20</b></span>
    <span>魂 <b id="player-soul">0</b></span>
    <span>山札 <b id="player-deck">0</b></span>
  </div>

  <div id="sacrifice-banner" class="sacrifice-banner hidden"></div>

  <div id="turn-banner" class="turn-banner hidden"></div>

  <div id="hand" class="hand"></div>

  <div class="controls">
    <button id="btn-draw">デッキから引く</button>
    <button id="btn-scavenge">死体を漁る</button>
    <button id="btn-end">ターン終了</button>
  </div>

  <div class="log">
    <h3>ログ</h3>
    <ul id="log-list"></ul>
  </div>
</div>

<div id="result-screen" class="screen">
  <h1 id="result-title">勝利</h1>
  <p id="result-desc"></p>
  <button id="btn-result-title">タイトルへ戻る</button>
</div>

<div id="toast" class="toast hidden"></div>

<div id="glossary-modal" class="modal hidden">
  <div class="modal-box">
    <h3>能力一覧</h3>
    <ul id="glossary-list" class="glossary-list"></ul>
    <button id="btn-glossary-close">閉じる</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="cards.js?v=24"></script>
<script src="net.js?v=24"></script>
<script src="script.js?v=24"></script>
</body>
</html>
